<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sand Traffic</title>
<style>
:root{--bg:#10373d;--card:#2c6b72;--tx:#eaf6f6;--road:#6b7088;--acc:#2f7de1;--slot:#25606a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;display:flex;justify-content:center;touch-action:manipulation;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;gap:8px;padding:8px 10px;box-sizing:border-box}
#hd{display:flex;justify-content:space-between;align-items:center;font-weight:700}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:7px 14px;background:var(--acc);color:#fff}
#pic{width:100%;max-height:30%;object-fit:contain;background:var(--card);border-radius:12px;image-rendering:pixelated}
#road{background:var(--road);border-radius:8px;width:100%;height:30px;flex:none;margin-top:0}
#st{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px}
#st button{padding:5px 10px;font-size:13px}
#its{display:flex;gap:8px;align-items:center}
#its button{flex:1;background:var(--slot);color:var(--tx);padding:5px 2px;font-size:12px;border-radius:8px}
#its #ps{flex:none;width:34px;height:34px;padding:0;border-radius:50%;background:#2f5fd0;font-size:11px;border:2px solid #cfe0ff}
#top{display:flex;gap:6px;align-items:flex-start;flex:none}
#pw{flex:none}
#hud{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;pointer-events:none}
#hud span{background:#25606a;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:3px 6px;font-weight:800;font-size:11px;text-align:center;white-space:nowrap}
#hm{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:64px 20px 54px;background:#6bbcf5;overflow:hidden}
#hms{position:absolute;inset:0}
#hms svg{width:100%;height:100%;display:block}
#hmr,#hm .dn{display:none}
#hm .dn{position:absolute;left:-20%;right:-20%;bottom:20%;height:30%;background:radial-gradient(ellipse at 50% 100%,#f6dc9a 60%,transparent 61%)}
#ttl{text-align:center;font-family:"Arial Rounded MT Bold","Apple SD Gothic Neo",system-ui,sans-serif;font-weight:900;line-height:1.05;z-index:1}
#ttl b{display:inline-block;font-size:clamp(36px,11vw,54px);text-shadow:0 3px 0 rgba(120,50,10,.9),0 6px 0 rgba(120,50,10,.8),0 10px 12px rgba(0,0,0,.35);-webkit-text-stroke:2px rgba(120,50,10,.85);paint-order:stroke fill}
#ttl small{display:table;margin:14px auto 0;font-size:14px;color:#fff;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.35);background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.5);border-radius:12px;padding:4px 14px}
#hmr{position:relative;width:100%;height:150px;display:flex;align-items:center;justify-content:center;z-index:1}
#hmr .rd{position:absolute;left:0;right:0;top:52%;height:64px;background:repeating-linear-gradient(90deg,#fff 0 22px,transparent 22px 44px) center/100% 4px no-repeat,#6b7088;border-top:3px solid #dfe3ee;border-bottom:3px solid #dfe3ee}
#hmr svg{position:relative;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
#go{min-width:230px;padding:16px 28px;font-size:26px;border-radius:20px;border:4px solid #fff3d0;background:linear-gradient(#ffc84e,#f08400);color:#fff;text-shadow:0 2px 0 rgba(150,70,0,.7);box-shadow:0 0 22px rgba(255,190,70,.85),0 6px 0 #b65a00;z-index:1;animation:pls 1.6s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.04)}}
#dgb{position:absolute;top:14px;right:14px;z-index:3;padding:8px 14px;font-size:15px;border-radius:16px;border:3px solid #fff3d0;background:linear-gradient(#7fb0ff,#3f78e8);color:#fff;text-shadow:0 1px 0 rgba(0,40,120,.6);box-shadow:0 4px 0 #2455b8}
#dg{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:#10373d;color:#eaf6f6;overflow-y:auto;padding:max(14px,env(safe-area-inset-top)) 14px 24px}
#dgh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#dgh b{font-size:22px}
#dgx{width:38px;height:38px;padding:0;border-radius:50%;background:#e23b3b;border:3px solid #ffd7a3;font-size:16px}
#dgt{display:flex;gap:6px;margin:8px 0}
#dgt button{flex:1;padding:8px 2px;font-size:13px;border-radius:12px;background:#25606a;color:#eaf6f6;border:2px solid transparent}
#dgt button.on{background:#2f7de1;border-color:#bcd8ff}
#dgp{height:10px;border-radius:6px;background:#25606a;overflow:hidden;margin:2px 0 4px}
#dgp i{display:block;height:100%;background:linear-gradient(#ffd45a,#ff9a1f)}
#dgc{font-size:13px;opacity:.85;margin-bottom:10px}
#dgg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcd{background:#1c4a52;border:2px solid #2f6b74;border-radius:14px;padding:6px 6px 8px;text-align:center;position:relative}
.dcd canvas{width:100%;display:block;border-radius:9px;image-rendering:pixelated}
.dcd.lk canvas{filter:brightness(0) opacity(.5)}
.dcd .q{position:absolute;left:0;right:0;top:22%;font-size:34px;font-weight:800;color:#cfe;opacity:.9}
.dcd .nm{margin-top:5px;font-size:14px;font-weight:800}
.dcd .st{font-size:11px;opacity:.75}
.dcd.cur{border-color:#ffd45a;box-shadow:0 0 12px rgba(255,212,90,.6)}
.dcd.ok{border-color:#7fe04a}
#dgl{text-align:center;padding:50px 20px;font-size:16px;line-height:1.7}
#dgr{margin:22px auto 0;background:transparent;border:1px solid #4a8a92;color:#9cc;font-size:12px;padding:6px 12px}
#dgd{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.8);gap:12px;color:#fff;font-size:22px;font-weight:800}
#dgd canvas{width:min(88vw,420px);border-radius:14px;border:4px solid #fff3d0;image-rendering:pixelated}
#pz{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(5,10,15,.65)}
#pzb{position:relative;width:min(82vw,340px);background:linear-gradient(#f5a43a,#e8801f);border-radius:26px;border:4px solid #f7c777;padding:46px 16px 18px;box-shadow:0 8px 24px rgba(0,0,0,.5);text-align:center}
#pzt{position:absolute;left:50%;top:-22px;transform:translateX(-50%);background:linear-gradient(#8fa8ff,#5b78e8);color:#fff;font-size:22px;font-weight:800;padding:8px 34px;border-radius:16px;border:3px solid #b9c8ff;text-shadow:0 2px 0 #2a3f9a;white-space:nowrap}
#pzx{position:absolute;right:-8px;top:-10px;width:34px;height:34px;padding:0;border-radius:50%;background:#e23b3b;border:3px solid #ffd7a3;font-size:16px}
#pzs{background:#fdebd2;border-radius:18px;padding:18px;display:flex;justify-content:center;gap:22px;margin-bottom:14px}
#pzs button{width:62px;height:62px;border-radius:16px;background:linear-gradient(#37d0ff,#1a9be0);border:3px solid #ffe2b0;font-size:28px;padding:0}
#pzr{display:flex;gap:10px}
#pzr button{flex:1;padding:12px;font-size:20px;border-radius:16px;border:3px solid #ffe2b0}
#pe{background:linear-gradient(#f0394a,#c4162a)}
#pc2{background:linear-gradient(#8ee03a,#4fa81a)}
#cp{position:absolute;left:0;right:0;bottom:6px;display:none;gap:8px;justify-content:center;align-items:center;z-index:3;background:rgba(0,0,0,.5);padding:8px;border-radius:12px}
.chip{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-sizing:border-box}
#ev,#sd{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,14,24,.8);color:#fff;font-size:20px;font-weight:800;text-align:center;padding:24px}
#ev button,#sd button{min-width:240px;padding:12px}
#sdx{background:#667}
#ev3{background:#667}
.sl{width:34px;height:34px;border-radius:8px;background:var(--slot);border:2px solid rgba(0,0,0,.15);box-sizing:border-box;color:#fff;font:700 13px/30px system-ui,sans-serif;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#bw{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;position:relative}
#bd{touch-action:manipulation}
#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.55);color:#fff;font-size:22px;font-weight:800;text-align:center;border-radius:12px}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:6px 12px;border-radius:999px;font-size:14px;display:none}

function homeSVG(lv){
 const n=lv+1,T=n<20?TH[0]:n<40?TH[1]:n<60?TH[2]:TH[3];
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const f1=p=>p[0].toFixed(1)+','+p[1].toFixed(1);
 const bez=(P,t)=>{const u=1-t;return[u*u*u*P[0][0]+3*u*u*t*P[1][0]+3*u*t*t*P[2][0]+t*t*t*P[3][0],u*u*u*P[0][1]+3*u*u*t*P[1][1]+3*u*t*t*P[2][1]+t*t*t*P[3][1]]};
 const mk=(SEG)=>{const cpt=s=>{const k=Math.min(SEG.length-1,Math.floor(s*SEG.length)),t=s*SEG.length-k;return bez(SEG[k],Math.min(1,t))};
  const nm=s=>{const a=cpt(Math.max(0,s-.005)),b=cpt(Math.min(.9999,s+.005)),dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[-dy/l,dx/l]};return{cpt,nm}};
 const edge=(C,k,wd,N)=>{const o=[];for(let i=0;i<=N;i++){const s=i/N,p=C.cpt(s),q=C.nm(s),w=wd(s);o.push([p[0]+q[0]*w*k,p[1]+q[1]*w*k])}return o};
 const poly=(a,b)=>a.concat(b.slice().reverse()).map(f1).join(' ');
 // road
 const RC=mk([[[310,335],[310,430],[95,470],[130,600]],[[130,600],[130,700],[255,725],[215,880]]]);
 const rw=s=>6+132*Math.pow(s,1.5);

 let dash='';for(let k=0;k<15;k++){const s1=.06+k*.062,s2=s1+.032,p1=RC.cpt(s1),p2=RC.cpt(s2),n1=RC.nm(s1),n2=RC.nm(s2),d1=rw(s1)*.04,d2=rw(s2)*.04;dash+=`<polygon points='${[[p1[0]+n1[0]*d1,p1[1]+n1[1]*d1],[p2[0]+n2[0]*d2,p2[1]+n2[1]*d2],[p2[0]-n2[0]*d2,p2[1]-n2[1]*d2],[p1[0]-n1[0]*d1,p1[1]-n1[1]*d1]].map(f1).join(' ')}' fill='#fff' opacity='.95'/>`}
 // curb stones
 let curb='';for(let k=0;k<26;k++)for(const side of [1,-1]){const s1=.04+k*.036,s2=s1+.026,a=RC.cpt(s1),b=RC.cpt(s2),na=RC.nm(s1),nb=RC.nm(s2),wa=rw(s1),wb=rw(s2);curb+=`<polygon points='${[[a[0]+na[0]*wa*side,a[1]+na[1]*wa*side],[b[0]+nb[0]*wb*side,b[1]+nb[1]*wb*side],[b[0]+nb[0]*(wb+7)*side,b[1]+nb[1]*(wb+7)*side],[a[0]+na[0]*(wa+7)*side,a[1]+na[1]*(wa+7)*side]].map(f1).join(' ')}' fill='${k%2?'#efe3c6':'#e2d3b0'}'/>`}
 // ribbons (sand rivers)
 const ribbon=(SEG,w0,w1,cols)=>{const C=mk(SEG);let o='';
  const lay=[[1,cols[2],0,6],[.78,cols[1],-4,0],[.5,cols[0],-7,-3]];
  lay.forEach(([sc,col,dy])=>{o+=`<polygon points='${poly(edge(C,1,s=>(w0+(w1-w0)*s)*sc,50).map(p=>[p[0],p[1]+dy]),edge(C,-1,s=>(w0+(w1-w0)*s)*sc,50).map(p=>[p[0],p[1]+dy]))}' fill='${col}'/>`});
  for(let j=-4;j<=4;j++){if(!j)continue;const pts=edge(C,1,s=>(w0+(w1-w0)*s)*(j/4.5),50).map(p=>[p[0],p[1]-4]);o+=`<polyline points='${pts.map(f1).join(' ')}' fill='none' stroke='rgba(255,255,255,${j<0?.22:.34})' stroke-width='${j<0?2.5:3.5}' stroke-linecap='round'/>`}
  return o};
 const riv1=ribbon([[[400,372],[330,380],[290,420],[210,432]],[[210,432],[120,444],[60,470],[-20,520]]],30,52,T.teal);
 const riv2=ribbon([[[-30,610],[40,600],[70,650],[150,690]],[[150,690],[230,730],[280,790],[330,880]]],30,56,T.teal);
 // dunes
 const dune=(d,i)=>`<path d='${d}' fill='url(#g${i})'/>`;
 const duneHi=(d)=>`<path d='${d}' fill='none' stroke='rgba(255,255,255,.55)' stroke-width='3' stroke-linecap='round'/>`;
 const D1="M-20,420 C30,350 120,320 200,350 C260,372 300,420 400,392 L400,844 L-20,844Z",D1h="M-20,420 C30,350 120,320 200,350 C260,372 300,420 400,392";
 const D2="M-20,560 C40,490 150,470 250,520 C320,556 360,600 410,580 L410,844 L-20,844Z",D2h="M-20,560 C40,490 150,470 250,520 C320,556 360,600 410,580";
 const D3="M-20,740 C60,690 170,720 240,790 C280,830 330,830 410,800 L410,844 L-20,844Z";
 const D4="M250,430 C300,420 360,440 410,470 L410,540 L250,540Z";
 const tree=(x,y,s)=>`<g transform='translate(${x} ${y}) scale(${s})'><ellipse cx='5' cy='2' rx='17' ry='5' fill='rgba(60,40,0,.3)'/><rect x='-3' y='-8' width='6' height='9' fill='#7a4a22'/><path d='M0,-58 L-17,-26 L17,-26Z' fill='${T.tree[1]}'/><path d='M0,-46 L-22,-14 L22,-14Z' fill='${T.tree[1]}'/><path d='M0,-30 L-26,-6 L26,-6Z' fill='${T.tree[2]}'/><path d='M0,-58 L-17,-26 L0,-26Z M0,-46 L-22,-14 L0,-14Z M0,-30 L-26,-6 L0,-6Z' fill='${T.tree[0]}' opacity='.75'/></g>`;
 const rock=(x,y,s)=>`<g transform='translate(${x} ${y}) scale(${s})'><ellipse cx='3' cy='4' rx='16' ry='5' fill='rgba(60,40,0,.3)'/><path d='M-16,2 Q-14,-14 0,-14 Q14,-14 16,2Z' fill='#9aa0a8'/><path d='M-12,-4 Q-10,-12 0,-12 Q4,-12 6,-8 Q-4,-6 -12,-4Z' fill='#cdd2d8'/></g>`;
 const TR=[[28,520,1],[62,545,1.05],[18,575,.9],[96,588,.9],[44,610,1.1],[352,470,.8],[372,498,.9],[340,522,.85],[368,545,1],[320,704,1],[350,742,1.2],[372,700,.95],[22,730,1.1],[42,772,1.2],[24,806,1.3],[300,640,.85],[376,610,1.05]].sort((a,b)=>a[1]-b[1]);
 const trees=TR.map(t=>tree(t[0],t[1],t[2])).join('')+rock(112,650,.9)+rock(300,596,.8)+rock(150,742,.7);
 let sparkle='';for(let i=0;i<90;i++){sparkle+=`<circle cx='${(rnd()*390).toFixed(0)}' cy='${(340+rnd()*500).toFixed(0)}' r='${(.6+rnd()*1.2).toFixed(1)}' fill='${rnd()<.5?'#fff':'#ffe9a8'}' opacity='${(.35+rnd()*.5).toFixed(2)}'/>`}
 const cloud=(x,y,sc)=>`<g transform='translate(${x} ${y}) scale(${sc})'><g filter='url(#blr)' fill='#fff'><ellipse cx='0' cy='0' rx='46' ry='17'/><ellipse cx='-28' cy='7' rx='30' ry='13'/><ellipse cx='30' cy='7' rx='34' ry='14'/><ellipse cx='2' cy='-14' rx='28' ry='16'/><ellipse cx='-12' cy='-8' rx='22' ry='13'/></g><ellipse cx='2' cy='12' rx='52' ry='7' fill='#cfe0f1' opacity='.5' filter='url(#blr)'/></g>`;
 const gd=T.gold.map((c,i)=>c);
 const defs=`<linearGradient id='sk' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${T.sky[0]}'/><stop offset='.4' stop-color='${T.sky[1]}'/></linearGradient>

 ${[0,1,2,3].map(i=>`<linearGradient id='g${i}' x1='0' y1='0' x2='.35' y2='1'><stop offset='0' stop-color='${T.gold[0]}'/><stop offset='.4' stop-color='${T.gold[1]}'/><stop offset='1' stop-color='${T.gold[2]}'/></linearGradient>`).join('')}
 <linearGradient id='rd' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${mixc(T.road,255,.18)}'/><stop offset='1' stop-color='${mixc(T.road,0,.15)}'/></linearGradient>`;
 return {defs,body:`<rect width='390' height='844' fill='url(#sk)'/><circle cx='330' cy='80' r='140' fill='url(#sg)'/>${cloud(66,186,1.15)}${cloud(310,150,.95)}${cloud(195,270,.8)}

 ${dune(D1,0)}${duneHi(D1h)}${riv1}${dune(D2,1)}${duneHi(D2h)}${riv2}${dune(D3,2)}

 for(let p=0;p<w*h;p++){const j=((((p/w)|0)*S+2)*w*S+(p%w)*S+2)*4;let b=ks[0],e0=1e9;for(const k of ks){const q=RGB[k],e=(d0[j]-q[0])**2+(d0[j+1]-q[1])**2+(d0[j+2]-q[2])**2;if(e<e0){e0=e;b=k}}const c=RGB[b];im.data[p*4]=c[0];im.data[p*4+1]=c[1];im.data[p*4+2]=c[2];im.data[p*4+3]=255}
